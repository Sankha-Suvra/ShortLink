version: '3'
services:
  backend:
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - mongo
      - redis
    environment:
      - DB_URI=${DB_URI}
      - REDIS_URL=${REDIS_URL}
    networks:
      - app-network
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge